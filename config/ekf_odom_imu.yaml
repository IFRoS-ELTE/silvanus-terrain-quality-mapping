# robot_localization EKF for Silvanus: wheel speed + IMU turn rate, 2D.
# Skid-steer wheels misjudge turns by 15-30 deg per run, so the wheels give only
# forward and sideways speed; the turn rate comes from the Xsens gyro.
ekf_filter_node:
  ros__parameters:
    frequency: 50.0
    two_d_mode: true
    publish_tf: false            # scout_base already publishes odom -> base_footprint
    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom
    # [x y z  roll pitch yaw  vx vy vz  vroll vpitch vyaw  ax ay az]
    odom0: /odom
    odom0_config: [false, false, false,  false, false, false,
                   true,  true,  false,  false, false, false,
                   false, false, false]
    imu0: /imu/data
    imu0_config: [false, false, false,  false, false, false,
                  false, false, false,  false, false, true,
                  false, false, false]
    imu0_remove_gravitational_acceleration: true
