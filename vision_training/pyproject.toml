[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "crackseg"
version = "0.1.0"
description = "Offline training and evaluation of the crack segmentation model for the Silvanus terrain mapping project"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pillow",
    "scipy",
    "pyyaml",
    "tqdm",
    "matplotlib",
    "torch>=2.1",
    "torchvision",
    "rosbags>=0.10",
]

[project.optional-dependencies]
onnx = ["onnx", "onnxruntime", "opencv-python-headless"]   # opencv: the deploy wrappers resize patches with it
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
